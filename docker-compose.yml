version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    env_file:
      - .env
    command:
      - "--config"
      - "/app/config.yaml"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-master-key}"
      UI_USERNAME: "${UI_USERNAME:-admin}"
      UI_PASSWORD: "${UI_PASSWORD:-admin123}"
      STORE_MODEL_IN_DB: "False"
      DATABASE_URL: "postgresql://litellm:litellm_secret@postgres:5432/litellm_db"
      DATABASE_TYPE: "postgresql"

      # Redis для кэширования (опционально)
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      # Настройки логирования
      LITELLM_LOG_LEVEL: "${LITELLM_LOG_LEVEL:-LITELLM_LOG_LEVEL:info}"

      # UI для управления (опционально)
      LITELLM_DASHBOARD: "True"

      # CORS
      CORS_ALLOW_ORIGINS: "*"

      # Лимиты по умолчанию
      LITELLM_MAX_PARALLEL_REQUESTS: 100
      LITELLM_REQUEST_TIMEOUT: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - litellm-network

  postgres:
    image: postgres:15-alpine
    container_name: litellm-postgres
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_secret
      POSTGRES_DB: litellm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: unless-stopped
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-}" --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - litellm-network

volumes:
  postgres_data:
  redis_data:

networks:
  litellm-network:
    driver: bridge
